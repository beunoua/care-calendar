# Chaque année, mettre à jour les dates des vacances scolaires.
# La garde est calculée automatiquement en fonction des contraintes du jugement
# codés en dur dans le programme.
#
# Les jours fériés sont calculés automatiquement.
#
# custom: quand on se met d'accord pour ne pas faire comme c'est marqué dans le jugement.

# comments: le texte explicatif affiché en bas de la page
comments: comments.md

# templates html
template_dir: templates

year: 2026

Vacances scolaires:
  css_class: "vacancesscolaires"
  dates:
    - 20/12/2025 - 04/01/2026
    - 21/02 - 08/03
    - 18/04 - 03/05
    - 04/07 - 31/08
    - 17/10 - 01/11
    - 19/12 - 03/01/2027


# custom : les jours où on fait pas comme c'est calculé
custom:
  css_class: "customcare"
  dates:
    - dates: 20/12/2025 - 04/01/2026
      care: B

